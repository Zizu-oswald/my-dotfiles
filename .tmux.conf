# Убираем задержку после нажатия Esc (важно для Vim)
set -s escape-time 10
# set -g repeat-time 4000

# Увеличиваем историю буфера (по умолчанию 2000)
set -g history-limit 10000

# Время циферок при выборе панели
set -g display-panes-time 3000

# Включаем мышь (выделение, скролл, переключение панелей)
set -g mouse on

# Разрешаем truecolor (если терминал поддерживает)
set -g default-terminal "screen-256color"

# Сортировка по имени
bind s choose-tree -sZ -O name

# Изменение индексов
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

unbind r
bind -n M-r source-file ~/.tmux.conf  

unbind '"'
unbind %

# Создание и удаление окон
bind c new-window
bind -n M-o new-window -c "#{pane_current_path}"
bind & kill-window

bind -n M-s choose-tree -s

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

bind -n M-Left resize-pane -L 5
bind -n M-Right resize-pane -R 5
bind -n M-Up resize-pane -U 2
bind -n M-Down resize-pane -D 2

bind -n M-- split-window -v -c "#{pane_current_path}"
bind -n M-| split-window -h -c "#{pane_current_path}"

# Перемещение (смена мест) панелей без Prefix по Alt + Ctrl + h/j/k/l
bind-key -n M-C-Down swap-pane -D
bind-key -n M-C-Up swap-pane -U

bind -n M-n next-window
bind -n M-p previous-window

bind -n M-q kill-pane
bind -n M-d detach
# bind-key -n M-[ copy-mode
# bind-key -n "M-;" copy-mode # так, потому что ебучие квадратные скобочки рот ебал, везде за что-то отвечают системное (yazi)
bind-key -n M-i copy-mode

bind -n M-/ copy-mode \; command-prompt -p "(search down)" "send -X search-forward '%%%'"
bind -n M-? copy-mode \; command-prompt -p "(search up)"   "send -X search-backward '%%%'"
set -g status-position bottom
### ---------- Копирование и вставка ----------

# Включаем режим копирования мышью и клавиатурой (vim-стиль)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Копировать в системный буфер (работает с xclip / pbcopy)
bind-key -T copy-mode-vi Y send-keys -X copy-pipe-and-cancel "xclip -sel clip -i"

# Префикс
set -g prefix C-a
bind C-a send-prefix

### для работы yazi
# Разрешить сквозную передачу графических escape-последовательностей
set -g allow-passthrough on

# Передавать переменные окружения терминала
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Включить passthrough (у вас уже есть, но проверьте)
# set -g allow-passthrough on

# Обязательно разрешить extended-keys для верного отклика терминала
set -s extended-keys on
###

# Плагины
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'tmux-plugins/tmux-resurrect'    # сохраняет сессии
set -g @plugin 'tmux-plugins/tmux-continuum'    # автосохранение сессий
set -g @plugin 'jimeh/tmux-themepack'
# set -g @plugin 'thekylehuang/cole-tmux'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @themepack 'powerline/double/green'

# Старт плагинов
run '~/.tmux/plugins/tpm/tpm'

